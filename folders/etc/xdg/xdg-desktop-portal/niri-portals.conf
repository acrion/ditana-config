# Ditana: under niri, the file chooser originates in xdg-desktop-portal-gtk, rather
# than in xdg-desktop-portal-gnome, which delegates it to nautilus. xdg-desktop-portal
# reads this file on top of niri's own /usr/share/xdg-desktop-portal/niri-portals.conf,
# thus directing every other interface to the location specified by that file.
[preferred]
org.freedesktop.impl.portal.FileChooser=gtk;
